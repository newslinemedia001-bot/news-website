<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | Newsight</title><link rel="stylesheet" href="/legacy/style.css"></head><body class="dashboard-page"><header class="dashboard-header"><a class="brand" href="/"><img src="https://newsight.co.ke/assets/logo/logo.png" alt="Newsight"></a><div class="dashboard-header-right"><span id="userEmail"></span><a href="/">Newsight</a><button id="logoutBtn" class="outline-button" type="button">Sign out</button></div></header><main class="container dashboard-wrap"><div class="dashboard-intro"><div><h1>Your articles</h1><p>Create, edit and manage your published stories.</p></div><button id="newArticleBtn" class="primary-button" type="button">+ New article</button></div><div id="dashboardMessage" class="dashboard-message hidden" role="status" aria-live="polite"></div><section id="editor" class="editor-panel hidden"><div class="editor-head"><div><h2 id="editorTitle">Create article</h2><p>Write and publish your Newsight story.</p></div><button id="closeEditorBtn" class="outline-button" type="button">Close</button></div><form id="articleForm"><input id="articleId" type="hidden"><div class="form-grid"><label>Title<input id="articleTitle" type="text" required></label><label>Category<select id="articleCategory"><option>Kenya</option><option>County</option><option>Business</option><option>Sports</option><option>Technology</option><option>World</option></select></label></div><label>Summary<textarea id="articleSummary" rows="3" required></textarea></label><label>Content<textarea id="articleContent" rows="14" required></textarea></label><label>Article image<input id="articleImageFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><div id="imagePreviewBox" class="image-preview-box hidden"><img id="imagePreview" alt="Image preview"><button id="removeImageBtn" class="outline-button" type="button">Remove image</button></div><label class="publish-toggle"><input id="publishNow" type="checkbox" checked> Publish now</label><div><button id="saveArticleBtn" class="primary-button" type="submit">Publish Article</button><button id="cancelEditorBtn" class="outline-button" type="button">Cancel</button></div></form></section><section><div id="articlesList"></div></section></main><script type="module" src="/legacy/dashboard.js"></script></body></html>
