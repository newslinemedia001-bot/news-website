<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign up | Newsight</title><link rel="stylesheet" href="/legacy/style.css"></head><body><main class="auth-page"><section class="auth-card"><a href="/"><img class="auth-logo" src="https://newsight.co.ke/assets/logo/logo.png" alt="Newsight"></a><h1>Create your account</h1><p>Join Newsight and start publishing your own stories.</p><form id="signupForm"><label>Full name<input id="fullName" name="fullName" type="text" autocomplete="name" required></label><label>Email<input id="email" name="email" type="email" autocomplete="email" required></label><label>Password<input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required></label><button class="primary-button" type="submit">Create account</button></form><div id="authMessage" class="auth-message" role="status" aria-live="polite"></div><p class="auth-switch">Already have an account? <a href="/login.html">Sign in</a></p><a class="back-link" href="/">← Back to Newsight</a></section></main><script type="module" src="/legacy/auth.js"></script></body></html>
